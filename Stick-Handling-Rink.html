/* Level definition: add new levels/challenges by editing this function */
function levelParams(level, groupOverride){
  const group = groupOverride || (level>=5 ? 3 : level>=3 ? 2 : 1);           // skaters spawned together
  return {
    speed: 4.2 + (level-1)*1.1,                            // z-units per second (L1 is ~30% faster than before)
    spawnEvery: Math.max(0.6, 2.0 - (level-1)*0.25)*(1+0.35*(group-1)), // seconds between waves
    wiggle: level < 3 ? 0 : Math.min(0.16, 0.05*(level-2)), // lateral sway (world units)
    group,
    fill: Math.min(4, 1+Math.floor(level/3)),               // objects between waves (custom + objects ON)
    needed: SKATERS_PER_LEVEL*group                         // skaters to pass to level up
  };
}

/* Active settings: Standard (progressive) or Custom (fixed level + fixed group size) */
function curParams(){
  return state.custom.on
    ? Object.assign(levelParams(state.level, state.custom.group), {needed:Infinity}) // never levels up
    : levelParams(state.level);
}
function loadCustom(){
  try{ const c=JSON.parse(localStorage.getItem('sh-custom')); if(c) return {on:!!c.on, obstacles:!!c.obstacles, level:Math.max(1,Math.min(10,c.level|0||1)), group:Math.max(1,Math.min(4,c.group|0||1))}; }catch(e){}
  return {on:false, obstacles:false, level:1, group:1};
}
function saveCustom(){ try{ localStorage.setItem('sh-custom',JSON.stringify(state.custom)); }catch(e){} }

/* ============ MAPS ============ */
const rnd = i => { const v=Math.sin(i*127.1+311.7)*43758.5453; return v-Math.floor(v); };
const px  = (x,y,w,h,c)=>{ ctx.fillStyle=c; ctx.fillRect(x,y,w,h); };
const ell = (x,y,rx,ry,c)=>{ ctx.fillStyle=c; ctx.beginPath(); ctx.ellipse(x,y,Math.max(0.1,rx),Math.max(0.1,ry),0,0,6.3); ctx.fill(); };
const tri = (x1,y1,x2,y2,x3,y3,c)=>{ ctx.fillStyle=c; ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.lineTo(x3,y3); ctx.closePath(); ctx.fill(); };
function vgrad(y0,y1,c0,c1){ const g=ctx.createLinearGradient(0,y0,0,y1); g.addColorStop(0,c0); g.addColorStop(1,c1); ctx.fillStyle=g; ctx.fillRect(0,y0,W,y1-y0); }
function starField(hy,n,seed){ for(let i=0;i<n;i++){ ctx.fillStyle=`rgba(255,255,255,${0.35+rnd(i+7)*0.65})`; const s=1+rnd(i+3)*1.8; ctx.fillRect(rnd(i+seed)*W, rnd(i*3+seed)*hy*0.8, s, s); } }

/* ---- 1. NHL rink with fans ---- */
function bdNHL(hy){
  vgrad(0,hy+2,'#0e1522','#26344a');
  const jersey=['#d62828','#1d4ed8','#f4f4f4','#facc15','#16a34a','#111827'], skin=['#f1c9a5','#d9a37a','#a8714c','#7a4a2e'];
  const rh=hy*0.17, y0=hy*0.14, fw=hy*0.1;
  for(let r=0;r<5;r++){
    const y=y0+r*rh;
    px(0,y+rh*0.85,W,rh*0.15,'rgba(0,0,0,0.35)');
    for(let x=-((r%2)*fw/2); x<W+fw; x+=fw*1.08){
      const i=r*977+Math.floor(x/3), sk=skin[(rnd(i+2)*4)|0];
      if(rnd(i+4)>0.82){ px(x-fw*0.55,y+rh*0.02,fw*0.15,rh*0.45,sk); px(x+fw*0.4,y+rh*0.02,fw*0.15,rh*0.45,sk); }
      px(x-fw*0.4,y+rh*0.42,fw*0.8,rh*0.5,jersey[(rnd(i)*6)|0]);
      circ(x,y+rh*0.3,fw*0.26,sk);
    }
  }
  vgrad(hy*0.88,hy+2,'rgba(220,235,245,0)','rgba(220,235,245,0.4)');
  const sw=W*0.2, sx=W/2-sw/2, sy=hy*0.3, sh=hy*0.34;
  ctx.strokeStyle='#666'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(sx+sw*0.2,0); ctx.lineTo(sx+sw*0.2,sy); ctx.moveTo(sx+sw*0.8,0); ctx.lineTo(sx+sw*0.8,sy); ctx.stroke();
  px(sx,sy,sw,sh,'#0b0f17'); ctx.strokeStyle='#e5b800'; ctx.strokeRect(sx,sy,sw,sh);
  text('HOME  0 – 0  AWAY', W/2, sy+sh*0.64, sh*0.3, '#ffd23f','center');
}

/* ---- 2. Halloween ---- */
function bare(x,y,len,ang,d,seed){
  if(d===0||len<3) return;
  const x2=x+Math.cos(ang)*len, y2=y+Math.sin(ang)*len;
  ctx.lineWidth=d*1.5; ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x2,y2); ctx.stroke();
  bare(x2,y2,len*0.74,ang-0.4-rnd(seed)*0.35,d-1,seed*1.7+1);
  bare(x2,y2,len*0.74,ang+0.4+rnd(seed+2)*0.35,d-1,seed*2.3+3);
}
function bdHalloween(hy){
  vgrad(0,hy+2,'#12061d','#5a2368'); starField(hy,60,5);
  const mx=W*0.8, my=hy*0.36, mr=hy*0.2;
  const g=ctx.createRadialGradient(mx,my,mr*0.8,mx,my,mr*2.6); g.addColorStop(0,'rgba(255,170,60,0.4)'); g.addColorStop(1,'rgba(255,170,60,0)');
  ctx.fillStyle=g; ctx.fillRect(mx-mr*3,my-mr*3,mr*6,mr*6);
  circ(mx,my,mr,'#ffb84d'); circ(mx-mr*0.3,my-mr*0.2,mr*0.18,'#f09a32'); circ(mx+mr*0.35,my+mr*0.25,mr*0.24,'#f09a32'); circ(mx+mr*0.1,my-mr*0.55,mr*0.1,'#f09a32');

  if(M.circle){ const p=proj(0,Z_FAR*0.38), rx=W*0.46*p.s*0.45; ctx.strokeStyle=M.circle; ctx.globalAlpha=0.6; ctx.lineWidth=Math.max(2,6*p.s); ctx.beginPath(); ctx.ellipse(p.x,p.y,rx,rx*0.22,0,0,6.3); ctx.stroke(); ctx.globalAlpha=1; circ(p.x,p.y,Math.max(2,rx*0.06),M.circle); }
  ctx.strokeStyle=M.lane; ctx.setLineDash([14,12]); ctx.lineWidth=2;
  for(const wx of [-0.6,-0.2,0.2,0.6]){ const p1=proj(wx,Z_FAR), p2=proj(wx,Z_NEAR*0.5); ctx.beginPath(); ctx.moveTo(p1.x,p1.y); ctx.lineTo(p2.x,p2.y); ctx.stroke(); }
  ctx.setLineDash([]);
  ctx.strokeStyle=M.edge; ctx.lineWidth=3;
  for(const wx of [-1,1]){ const p1=proj(wx,Z_FAR), p2=proj(wx,Z_NEAR*0.5); ctx.beginPath(); ctx.moveTo(p1.x,p1.y); ctx.lineTo(p2.x,p2.y); ctx.stroke(); }
  if(M.decor) M.decor();
  if(M.side) for(const z of SIDE_Z) for(const sd of [-1,1]){ const p=proj(sd*1.24,z); M.side(p.x,p.y,H*0.55*p.s,(z|0)+sd*3,sd); }
}

/* ============ STATE ============ */
const cv = document.getElementById('c'); let ctx = cv.getContext('2d');
let W=0, H=0, DPR=1;
const state = {
  mode:'title', profile:loadProfile(), map:loadMap(), custom:loadCustom(), level:1, passed:0, total:0, hits:0,
  skaters:[], objects:[], fillTimer:0, stars:0, slow:0, spawnTimer:0, time:0, puckOn:false,
  puck:{x:0}, flash:0
};

function resize(){
  DPR = Math.min(window.devicePixelRatio||1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W*DPR; cv.height = H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener('resize', resize); resize();

/* ============ PROJECTION ============ */
function proj(wx, z){
  const s = Z_NEAR/z, hy = H*HORIZON;
  return { x: W/2 + wx*(W*0.46)*s, y: hy + (H-hy)*s, s };
}

/* ============ GAME LOGIC ============ */
function startGame(){
  TEAMS = TEAM_SETS[state.profile]; saveProfile();
  Object.assign(state,{mode:'play',level:state.custom.on?state.custom.level:1,passed:0,total:0,hits:0,skaters:[],objects:[],fillTimer:0,stars:0,slow:0,spawnTimer:0,flash:0});
}

function spawn(){
  const p = curParams();
  const recent = state.skaters.filter(s=>s.z > Z_FAR-8).length + state.objects.filter(o=>o.z > Z_FAR-8).length;
  const free = [0,1,2,3,4].filter(i=>!state.skaters.some(s=>s.lane===i && s.z > Z_FAR-7) && !state.objects.some(o=>o.lane===i && o.z > Z_FAR-7));
  // never fill more than 4 of the 5 lanes near the spawn line
  let n = Math.min(p.group, free.length, 4-recent);
  if(n<1) return;
  const teams = TEAMS.slice().sort(()=>Math.random()-0.5);   // different teams in one wave
  for(let k=0;k<n;k++){
    const lane = free.splice(Math.floor(Math.random()*free.length),1)[0];
    const team = teams[k%teams.length];
    state.skaters.push({
      lane, z:Z_FAR, phase:Math.random()*6.28, hit:false,
      team, color:team.color, speedMul:0.95+Math.random()*0.15
    });
  }
}

/* Object types: weights are relative; gold star is deliberately rare (power-up) */
const OBJ_WEIGHTS = [['pylon',30],['bomb',22],['dynamite',22],['zombie',26]];
const STAR_CHANCE = 0.035;
function pickKind(){
  if(Math.random()<STAR_CHANCE) return 'star';
  let r=Math.random()*OBJ_WEIGHTS.reduce((a,b)=>a+b[1],0);
  for(const [k,w] of OBJ_WEIGHTS){ if((r-=w)<0) return k; }
  return 'pylon';
}
/* Fills the gap between two skater waves; amount scales with level (p.fill) */
function spawnObjects(p){
  const near = e=>e.z > Z_FAR-7;
  const recent = state.skaters.filter(s=>s.z>Z_FAR-8).length + state.objects.filter(o=>o.z>Z_FAR-8).length;
  const free = [0,1,2,3,4].filter(i=>!state.skaters.some(s=>s.lane===i&&near(s)) && !state.objects.some(o=>o.lane===i&&near(o)));
  const n = Math.min(p.fill, free.length, 4-recent);
  for(let k=0;k<n;k++){
    const lane = free.splice(Math.floor(Math.random()*free.length),1)[0];
    state.objects.push({kind:pickKind(), lane, z:Z_FAR, x:LANES[lane], phase:Math.random()*6.28, hit:false});
  }
}
function advance(e,p,dt){ e.z -= p.speed*(e.speedMul||1)*dt*(0.5+0.5*Z_FAR/Math.max(e.z,6)*0.5+0.25); }

function update(dt){
  state.time += dt;
  if(state.mode!=='play') return;
  const p = curParams();
  if(state.slow>0) state.slow=Math.max(0,state.slow-dt);
  const wdt = state.slow>0 ? dt*0.5 : dt;             // gold star = slow-mo
  state.spawnTimer -= wdt;
  if(state.spawnTimer<=0){
    spawn(); state.spawnTimer = p.spawnEvery*(0.8+Math.random()*0.4);
    if(state.custom.on && state.custom.obstacles) state.fillTimer = state.spawnTimer*0.5; // mid-gap
  }
  if(state.fillTimer>0){ state.fillTimer-=wdt; if(state.fillTimer<=0) spawnObjects(p); }
  for(const s of state.skaters){
    advance(s,p,wdt);
    s.x = LANES[s.lane] + Math.sin(state.time*1.6 + s.phase)*p.wiggle;
  }
  for(const o of state.objects){
    advance(o,p,wdt);
    o.x = LANES[o.lane] + (o.kind==='zombie' ? Math.sin(state.time*2.2+o.phase)*0.06 : 0);
  }
  checkCollisions();
  for(let i=state.skaters.length-1;i>=0;i--){
    if(state.skaters[i].z < Z_NEAR*0.62){
      state.skaters.splice(i,1); state.passed++; state.total++;
      if(state.passed>=p.needed){ state.level++; state.passed=0; state.flash=-1; }
    }
  }
  for(let i=state.objects.length-1;i>=0;i--) if(state.objects[i].z < Z_NEAR*0.62) state.objects.splice(i,1);
  if(state.flash>0) state.flash=Math.max(0,state.flash-dt*2.5);
  if(state.flash<0) state.flash=Math.min(0,state.flash+dt*1.2);
}

/* Only active when "Touch puck" mode is on; otherwise purely visual practice. */
function checkCollisions(){
  if(!state.puckOn) return;
  const touching = e => !e.hit && e.z < Z_NEAR*1.5 && e.z > Z_NEAR*0.8 && Math.abs(e.x - state.puck.x) < 0.22;
  for(const s of state.skaters){
    if(touching(s)){ s.hit=true; state.hits++; state.flash=1; }
  }
  for(const o of state.objects){
    if(!touching(o)) continue;
    o.hit=true;
    if(o.kind==='star'){ state.stars++; state.slow=6; }   // power-up: 6s slow-mo
    else { state.hits++; state.flash=1; }                  // pylon / bomb / dynamite / zombie
  }
}

/* ============ DRAWING ============ */
function drawSkater(s){
  const x = s.x ?? LANES[s.lane];
  const p = proj(x, s.z), sc = p.s;
  const h = H*0.62*sc, w = h*0.42;
  if(h<4) return;
  const swing = Math.sin(state.time*8 + s.phase)*w*0.18;
  ctx.save(); ctx.translate(p.x, p.y);
  // shadow
  ctx.fillStyle='rgba(30,60,90,0.25)';
  ctx.beginPath(); ctx.ellipse(0,0,w*0.7,h*0.04,0,0,6.3); ctx.fill();
  // legs
  ctx.fillStyle='#1b1f2a';
  ctx.fillRect(-w*0.32+swing, -h*0.42, w*0.26, h*0.42);
  ctx.fillRect( w*0.06-swing, -h*0.42, w*0.26, h*0.42);
  ctx.fillStyle='#9aa5b1';
  ctx.fillRect(-w*0.36+swing, -h*0.025, w*0.34, h*0.025);
  ctx.fillRect( w*0.02-swing, -h*0.025, w*0.34, h*0.025);
  // torso (jersey)
  ctx.fillStyle=s.color;
  rr(-w*0.5, -h*0.78, w, h*0.4, w*0.18);
  const im=s.team.img;
  if(im.complete && im.naturalWidth){
    const bw=w*0.86, bh=h*0.36, ar=im.naturalWidth/im.naturalHeight;
    let lw=bw, lh=bw/ar; if(lh>bh){ lh=bh; lw=bh*ar; }
    ctx.fillStyle='rgba(255,255,255,0.93)'; rr(-bw/2, -h*0.77, bw, bh*1.04, w*0.12);
    ctx.drawImage(im, -lw/2, -h*0.77+(bh*1.04-lh)/2, lw, lh);
  }
  // arms
  ctx.fillStyle=s.color;
  ctx.fillRect(-w*0.68, -h*0.76, w*0.2, h*0.3);
  ctx.fillRect( w*0.48, -h*0.76, w*0.2, h*0.3);
  // head + helmet
  ctx.fillStyle='#f1c9a5';
  ctx.beginPath(); ctx.arc(0,-h*0.86,w*0.28,0,6.3); ctx.fill();
  ctx.fillStyle='#222';
  ctx.beginPath(); ctx.arc(0,-h*0.88,w*0.3,3.14,6.28); ctx.fill();
  // stick
  ctx.strokeStyle='#6b4a2b'; ctx.lineWidth=Math.max(2,w*0.07);
  ctx.beginPath(); ctx.moveTo(w*0.6,-h*0.62); ctx.lineTo(w*0.95,-h*0.02); ctx.stroke();
  ctx.fillStyle='#111'; ctx.fillRect(w*0.8,-h*0.03,w*0.4,h*0.03);
  ctx.restore();
}
function rr(x,y,w,h,r){ ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x,y,w,h,r) : ctx.rect(x,y,w,h); ctx.fill(); }


/* ---- objects ---- */
function circ(x,y,r,col){ ctx.fillStyle=col; ctx.beginPath(); ctx.arc(x,y,r,0,6.3); ctx.fill(); }
function drawPylon(h){
  const w=h*0.8, hw=y=>w*(0.36-0.24*((y-0.07)/0.93));
  ctx.fillStyle='#b8480a'; ctx.fillRect(-w*0.5,-h*0.07,w,h*0.07);
  const poly=(y0,y1,col)=>{ ctx.fillStyle=col; ctx.beginPath(); ctx.moveTo(-hw(y0),-h*y0); ctx.lineTo(hw(y0),-h*y0); ctx.lineTo(hw(y1),-h*y1); ctx.lineTo(-hw(y1),-h*y1); ctx.closePath(); ctx.fill(); };
  poly(0.07,1,'#ff6a00'); poly(0.36,0.5,'#fff'); poly(0.64,0.76,'#fff');
}
function spark(x,y,r){ const f=1+0.35*Math.sin(state.time*22); circ(x,y,r*2*f,'rgba(255,120,0,0.45)'); circ(x,y,r*f,'#ffd23f'); }
function drawBomb(h){
  const r=h*0.5;
  circ(0,-r,r,'#16181d'); circ(-r*0.35,-r*1.35,r*0.22,'rgba(255,255,255,0.28)');
  ctx.fillStyle='#4a4f58'; ctx.fillRect(-r*0.24,-2*r-r*0.08,r*0.48,r*0.22);
  ctx.strokeStyle='#c9a66b'; ctx.lineWidth=Math.max(1.5,r*0.1);
  ctx.beginPath(); ctx.moveTo(0,-2*r); ctx.quadraticCurveTo(r*0.4,-2*r-r*0.5,r*0.75,-2*r-r*0.3); ctx.stroke();
  spark(r*0.75,-2*r-r*0.3,r*0.13);
}
function drawDynamite(h){
  const sw=h*0.26;
  [[-sw,0.82],[sw,0.82],[0,0.92]].forEach(([x,k])=>{
    ctx.fillStyle='#c1121f'; ctx.fillRect(x-sw/2,-h*k,sw,h*k);
    ctx.fillStyle='rgba(255,255,255,0.22)'; ctx.fillRect(x-sw/2,-h*k,sw*0.2,h*k);
  });
  ctx.fillStyle='#e0c28a'; ctx.fillRect(-sw*1.55,-h*0.62,sw*3.1,h*0.1); ctx.fillRect(-sw*1.55,-h*0.28,sw*3.1,h*0.1);
  ctx.strokeStyle='#8a6a3b'; ctx.lineWidth=Math.max(1.5,h*0.03);
  ctx.beginPath(); ctx.moveTo(0,-h*0.92); ctx.quadraticCurveTo(sw*0.2,-h*1.08,sw*0.7,-h*1.1); ctx.stroke();
  spark(sw*0.7,-h*1.1,h*0.045);
}
function drawZombie(h,phase){
  const w=h*0.42, sw=Math.sin(state.time*5+phase)*w*0.14;
  ctx.fillStyle='#3a4254';
  ctx.fillRect(-w*0.32+sw,-h*0.42,w*0.26,h*0.42); ctx.fillRect(w*0.06-sw,-h*0.42,w*0.26,h*0.42);
  ctx.fillStyle='#55657a'; rr(-w*0.5,-h*0.78,w,h*0.4,w*0.12);
  ctx.fillStyle='#3a4254'; // torn shirt hem + tears
  for(let k=0;k<4;k++){ ctx.beginPath(); ctx.moveTo(-w*0.5+k*w*0.25,-h*0.38); ctx.lineTo(-w*0.5+k*w*0.25+w*0.12,-h*0.46); ctx.lineTo(-w*0.5+(k+1)*w*0.25,-h*0.38); ctx.fill(); }
  ctx.fillRect(-w*0.1,-h*0.7,w*0.18,h*0.1);
  ctx.strokeStyle='#7cb342'; ctx.lineWidth=Math.max(2,w*0.16); ctx.lineCap='round';
  for(const sd of [-1,1]){ ctx.beginPath(); ctx.moveTo(sd*w*0.5,-h*0.74); ctx.lineTo(sd*w*0.92,-h*(0.6+0.03*Math.sin(state.time*4+phase+sd))); ctx.stroke(); circ(sd*w*0.95,-h*0.6,w*0.11,'#6aa332'); }
  ctx.lineCap='butt';
  circ(0,-h*0.87,w*0.3,'#8bc34a');
  ctx.fillStyle='#222'; ctx.beginPath(); ctx.arc(0,-h*0.9,w*0.31,3.4,6.0); ctx.fill();
  circ(-w*0.1,-h*0.88,w*0.055,'#e11'); circ(w*0.1,-h*0.88,w*0.055,'#e11');
  ctx.fillStyle='#2b1b1b'; ctx.fillRect(-w*0.1,-h*0.81,w*0.2,h*0.02);
}
function drawStar(R,phase){
  const bob=Math.sin(state.time*4+phase)*R*0.25, cy=-R*1.5+bob;
  const g=ctx.createRadialGradient(0,cy,R*0.2,0,cy,R*2);
  g.addColorStop(0,'rgba(255,225,90,0.55)'); g.addColorStop(1,'rgba(255,225,90,0)');
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,cy,R*2,0,6.3); ctx.fill();
  ctx.save(); ctx.translate(0,cy); ctx.rotate(state.time*1.2+phase);
  ctx.beginPath();
  for(let k=0;k<10;k++){ const r=k%2?R*0.45:R, a=-Math.PI/2+k*Math.PI/5; ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r); }
  ctx.closePath(); ctx.fillStyle='#ffd23f'; ctx.fill();
  ctx.lineWidth=Math.max(1.5,R*0.1); ctx.strokeStyle='#ff9f1c'; ctx.stroke();
  ctx.restore();
}
function drawObject(o){
  const p=proj(o.x,o.z), sc=p.s, base=H*0.5*sc;
  if(base<3) return;
  ctx.save(); ctx.translate(p.x,p.y);
  ctx.fillStyle='rgba(30,60,90,0.25)'; ctx.beginPath(); ctx.ellipse(0,0,base*0.2,base*0.035,0,0,6.3); ctx.fill();
  if(o.kind==='pylon') drawPylon(base*0.42);
  else if(o.kind==='bomb') drawBomb(base*0.36);
  else if(o.kind==='dynamite') drawDynamite(base*0.4);
  else if(o.kind==='zombie') drawZombie(H*0.58*sc,o.phase);
  else if(o.kind==='star') drawStar(base*0.2,o.phase);
  ctx.restore();
}

function drawPuck(){
  const p = proj(state.puck.x, Z_NEAR*1.0);
  ctx.fillStyle='rgba(0,0,0,0.25)'; ctx.beginPath(); ctx.ellipse(p.x,p.y-8,34,10,0,0,6.3); ctx.fill();
  ctx.fillStyle='#111'; ctx.beginPath(); ctx.ellipse(p.x,p.y-18,30,12,0,0,6.3); ctx.fill();
  ctx.fillStyle='#333'; ctx.beginPath(); ctx.ellipse(p.x,p.y-22,30,11,0,0,6.3); ctx.fill();
}

function text(t,x,y,size,color,align){
  ctx.font=`700 ${size}px -apple-system,system-ui,sans-serif`;
  ctx.textAlign=align||'left'; ctx.fillStyle=color; ctx.fillText(t,x,y);
}

const btn = {x:0,y:0,w:0,h:0};
const menuBtn = {x:0,y:0,w:0,h:0};   // in-game "Menu" button
const menuBtns = {};                  // title-screen buttons (charlotte, elliot, start)
const hit = (b,e)=> b && e.clientX>=b.x && e.clientX<=b.x+b.w && e.clientY>=b.y && e.clientY<=b.y+b.h;
function pill(b,fill,stroke){ ctx.fillStyle=fill; ctx.beginPath(); ctx.roundRect?ctx.roundRect(b.x,b.y,b.w,b.h,12):ctx.rect(b.x,b.y,b.w,b.h); ctx.fill(); if(stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=4; ctx.stroke(); } }
function drawHUD(){
  const pad=18, fs=Math.max(18,Math.min(W,H)*0.035);
  ctx.fillStyle='rgba(10,25,45,0.65)'; ctx.fillRect(0,0,W,fs*2.1);
  text((state.custom.on?'Custom · Level ':'Level ')+state.level, pad, fs*1.4, fs, '#fff');
  text(state.custom.on ? 'Passed '+state.passed+'  ·  up to '+state.custom.group+' at once' : 'Passed '+state.passed+' / '+curParams().needed, W/2, fs*1.4, fs*(state.custom.on?0.85:1), '#cfe6f3','center');
  if(state.puckOn) text('Hits '+state.hits, W-pad-fs*7.5, fs*1.4, fs, '#ff8a8a','right');
  // puck-mode toggle
  btn.w=fs*7; btn.h=fs*1.4; btn.x=W-pad-btn.w; btn.y=fs*0.35;
  ctx.fillStyle=state.puckOn?'#2a9d8f':'#566a80';
  ctx.beginPath(); ctx.roundRect ? ctx.roundRect(btn.x,btn.y,btn.w,btn.h,10) : ctx.rect(btn.x,btn.y,btn.w,btn.h); ctx.fill();
  text(state.puckOn?'Touch puck: ON':'Touch puck: OFF', btn.x+btn.w/2, btn.y+btn.h*0.68, fs*0.6, '#fff','center');
  if(state.custom.on && state.custom.obstacles){
    text('★ '+state.stars+(state.slow>0?'   SLOW-MO '+Math.ceil(state.slow)+'s':''), pad, fs*3.5, fs*0.95, '#ffd23f');
  }
  menuBtn.w=fs*3.2; menuBtn.h=fs*1.2; menuBtn.x=pad; menuBtn.y=H-menuBtn.h-pad;
  pill(menuBtn,'rgba(10,25,45,0.55)');
  text('Menu', menuBtn.x+menuBtn.w/2, menuBtn.y+menuBtn.h*0.7, fs*0.6, '#fff','center');
}

function drawOverlay(){
  if(state.mode==='title'){
    ctx.fillStyle='rgba(8,20,36,0.9)'; ctx.fillRect(0,0,W,H);
    const fs=Math.min(W,H)*0.065, cx=W/2;
    text('Stick-Handling Rink', cx, H*0.1, fs*1.25, '#fff','center');
    text('Skaters come at you in 5 lanes. Move your puck to dodge them!', cx, H*0.15, fs*0.45, '#cfe6f3','center');
    text('Who is playing?', cx, H*0.215, fs*0.55, '#ffd166','center');
    const bw=Math.min(W*0.36,fs*6), bh=fs*1.05, gap=W*0.04;
    ['charlotte','elliot'].forEach((k,i)=>{
      const b = menuBtns[k] = {x:cx+(i?gap/2:-gap/2-bw), y:H*0.235, w:bw, h:bh};

      text(k[0].toUpperCase()+k.slice(1), b.x+bw/2, b.y+bh*0.68, fs*0.6, '#fff','center');
      const set=TEAM_SETS[k], ls=Math.min(bw/3.3, fs*1.2);
      set.forEach((t,n)=>{
        const im=t.img; if(!(im.complete&&im.naturalWidth)) return;
        const ar=im.naturalWidth/im.naturalHeight, lw=ar>=1?ls:ls*ar, lh=ar>=1?ls/ar:ls;
        const lx=b.x+bw/2+(n-(set.length-1)/2)*(ls*1.12), ly=b.y+bh+ls*0.75;
        ctx.globalAlpha=sel?1:0.45; ctx.drawImage(im,lx-lw/2,ly-lh/2,lw,lh); ctx.globalAlpha=1;
      });
    });
    // map selector
    {
      const my=H*0.425, mh=bh*0.9;
      const nm = menuBtns.mapName = {x:cx-bw*0.9, y:my, w:bw*1.8, h:mh};
      const pv = menuBtns.mapPrev = {x:nm.x-mh-gap*0.4, y:my, w:mh, h:mh};
      const nx = menuBtns.mapNext = {x:nm.x+nm.w+gap*0.4, y:my, w:mh, h:mh};
      pill(pv,'#33475f'); text('‹', pv.x+mh/2, my+mh*0.78, fs*1.2, '#fff','center');
      pill(nx,'#33475f'); text('›', nx.x+mh/2, my+mh*0.78, fs*1.2, '#fff','center');
      pill(nm,'#2f4a6b'); text('Map: '+MAPS[state.map].name, cx, my+mh*0.67, fs*0.55, '#fff','center');
    }
    // game mode: Standard vs Custom
    const cu = state.custom;
    ['standard','custom'].forEach((k,i)=>{
      const b = menuBtns[k] = {x:cx+(i?gap/2:-gap/2-bw), y:H*0.52, w:bw, h:bh*0.9};
      const sel = (k==='custom')===cu.on;
      pill(b, sel?'#e07a1f':'#33475f', sel?'#fff':null);
      text(k==='custom'?'Custom game':'Standard game', b.x+bw/2, b.y+b.h*0.67, fs*0.55, '#fff','center');
    });
    // custom options (steppers)
    const rows=[['lv','Difficulty level',cu.level,H*0.61],['gr','Max skaters at once',cu.group,H*0.69]];
    for(const [id,label,val,y] of rows){
      if(!cu.on){ delete menuBtns[id+'Minus']; delete menuBtns[id+'Plus']; continue; }
      const sb=fs*1.1, h=sb;
      const m = menuBtns[id+'Minus'] = {x:cx+bw*0.12, y:y, w:sb, h:h};
      const pl = menuBtns[id+'Plus']  = {x:cx+bw*0.12+sb+fs*1.8, y:y, w:sb, h:h};
      text(label, cx+bw*0.04, y+h*0.7, fs*0.55, '#fff','right');
      pill(m,'#33475f'); text('−', m.x+sb/2, m.y+h*0.74, fs*0.9, '#fff','center');
      pill(pl,'#33475f'); text('+', pl.x+sb/2, pl.y+h*0.74, fs*0.9, '#fff','center');
      text(String(val), m.x+sb+fs*0.9, y+h*0.74, fs*0.8, '#ffd166','center');
    }
    if(cu.on){
      const y=H*0.77, sb=fs*1.1, w=sb*2+fs*1.8;
      const b = menuBtns.obj = {x:cx+bw*0.12, y:y, w:w, h:sb};
      text('Objects between waves', cx+bw*0.04, y+sb*0.7, fs*0.55, '#fff','right');
      pill(b, cu.obstacles?'#2a9d8f':'#566a80'); text(cu.obstacles?'ON':'OFF', b.x+w/2, y+sb*0.7, fs*0.6, '#fff','center');
    } else delete menuBtns.obj;
    const sb2 = menuBtns.start = {x:cx-bw*0.6, y:H*0.865, w:bw*1.2, h:bh*1.1};
    pill(sb2,'#ffd166'); text('Start', sb2.x+sb2.w/2, sb2.y+sb2.h*0.7, fs*0.75, '#1b2a3a','center');
  }
  if(state.slow>0){ ctx.fillStyle='rgba(90,170,255,0.13)'; ctx.fillRect(0,0,W,H); }
  if(state.flash>0){ ctx.fillStyle=`rgba(255,40,40,${state.flash*0.35})`; ctx.fillRect(0,0,W,H); }
  if(state.flash<0){
    const fs=Math.min(W,H)*0.09;
    ctx.globalAlpha=Math.min(1,-state.flash*1.5);
    text('Level '+state.level+'!', W/2, H*0.45, fs, '#ffd166','center');
    ctx.globalAlpha=1;
  }
}

function draw(){
  ctx.clearRect(0,0,W,H);
  drawRink();
  const items = state.skaters.concat(state.objects).sort((a,b)=>b.z-a.z); // far first
  for(const it of items) it.kind ? drawObject(it) : drawSkater(it);
  { const M=MAPS[state.map]; if(M.fx) M.fx(H*HORIZON); }
  if(state.puckOn && state.mode==='play') drawPuck();
  drawHUD();
  drawOverlay();
}

/* ============ INPUT ============ */
function pointerX(e){ return (e.clientX - W/2)/(W*0.46); }
cv.addEventListener('pointerdown', e=>{
  e.preventDefault();
  if(state.mode==='title'){
    for(const k of ['charlotte','elliot']) if(hit(menuBtns[k],e)){ state.profile=k; saveProfile(); return; }
    if(hit(menuBtns.mapPrev,e)){ state.map=(state.map+MAPS.length-1)%MAPS.length; saveMap(); return; }
    if(hit(menuBtns.mapNext,e)||hit(menuBtns.mapName,e)){ state.map=(state.map+1)%MAPS.length; saveMap(); return; }
    if(hit(menuBtns.standard,e)){ state.custom.on=false; saveCustom(); return; }
    if(hit(menuBtns.custom,e)){ state.custom.on=true; saveCustom(); return; }
    if(state.custom.on){
      const c=state.custom, adj=(k,d,lo,hi)=>{ c[k]=Math.max(lo,Math.min(hi,c[k]+d)); saveCustom(); };
      if(hit(menuBtns.obj,e)){ c.obstacles=!c.obstacles; saveCustom(); return; }
      if(hit(menuBtns.lvMinus,e)) return adj('level',-1,1,10);
      if(hit(menuBtns.lvPlus,e))  return adj('level', 1,1,10);
      if(hit(menuBtns.grMinus,e)) return adj('group',-1,1,4);
      if(hit(menuBtns.grPlus,e))  return adj('group', 1,1,4);
    }
    if(hit(menuBtns.start,e)) startGame();
    return;
  }
  if(hit(menuBtn,e)){ state.mode='title'; state.skaters=[]; state.objects=[]; return; }
  if(e.clientX>=btn.x && e.clientX<=btn.x+btn.w && e.clientY>=btn.y && e.clientY<=btn.y+btn.h){
    state.puckOn=!state.puckOn; state.hits=0; return;
  }
  state.puck.x=Math.max(-0.95,Math.min(0.95,pointerX(e)));
});
cv.addEventListener('pointermove', e=>{
  if(e.buttons||e.pointerType==='touch') state.puck.x=Math.max(-0.95,Math.min(0.95,pointerX(e)));
});
addEventListener('keydown', e=>{
  if(state.mode==='title'&&(e.key===' '||e.key==='Enter')) startGame();
  if(e.key==='ArrowLeft') state.puck.x=Math.max(-0.95,state.puck.x-0.1);
  if(e.key==='ArrowRight') state.puck.x=Math.min(0.95,state.puck.x+0.1);
});
document.addEventListener('gesturestart', e=>e.preventDefault());

/* ============ MAIN LOOP ============ */
let last=performance.now();
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  update(dt); draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
